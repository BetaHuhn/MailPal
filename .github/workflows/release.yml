name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Prepare setup assets
        run: |
          mkdir -p dist
          cp scripts/setup.ts dist/mailpal-setup.ts
          sha256sum dist/mailpal-setup.ts > dist/mailpal-setup-checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: ${{ contains(inputs.tag, '-') }}
          generate_release_notes: true
          files: |
            dist/mailpal-setup.ts
            dist/mailpal-setup-checksums.txt
